name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check commit messages
        uses: casteroid/webext-release/lint-commits@cce3e9d7c8428199bc30ea8b80f19d4533cac581 # v1.1.0

      - run: npm test

      - name: Build and package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: release/*.zip
          if-no-files-found: error
