name: Publish

# Retries the Chrome Web Store upload for an existing release tag. Release already publishes; run this only when the
# store job failed or was skipped. See https://github.com/casteroid/webext-release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to the Chrome Web Store, e.g. v0.2.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: casteroid/webext-release/.github/workflows/publish.yml@6d7e6dc000cfd09f1642b0182ec57912c68b9d2c # v1.0.1
    with:
      tag: ${{ inputs.tag }}
      chrome-package: "*.zip"
