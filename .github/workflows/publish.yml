name: Publish

# Retries the store uploads for an existing release tag. Release already publishes; run this only when a store job
# failed or was skipped. See https://github.com/casteroid/webext-release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to the stores, e.g. v0.3.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: casteroid/webext-release/.github/workflows/publish.yml@cce3e9d7c8428199bc30ea8b80f19d4533cac581 # v1.1.0
    with:
      tag: ${{ inputs.tag }}
      chrome-package: "*.zip"
      firefox-package: "*.xpi"
    secrets:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
