name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, scripts/site.mjs, store/screenshots/**, src/icons/**, .github/workflows/pages.yml]
  # Daily rebuild so the dates in the "Try it here" demo stay relative to today.
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - run: npm run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
